# CI: test + zip package (Step 1) + Docker image to Docker Hub (Step 5)
#
# Docker Hub secrets (repo → Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  - your Docker Hub user
#   DOCKERHUB_TOKEN     - access token (not account password)

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

  package:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish HelloWorld
        run: |
          dotnet publish HelloWorld/HelloWorld.csproj \
            --configuration Release \
            --output ./publish/HelloWorld

      - name: Upload HelloWorld package
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld
          path: src/publish/HelloWorld
          if-no-files-found: error

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Always build so PRs catch Dockerfile breaks; push only on master
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/HelloWorld/Dockerfile
          push: false
          load: true
          tags: helloworld:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/helloworld"
          docker tag helloworld:ci "${IMAGE}:latest"
          docker tag helloworld:ci "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "Pushed ${IMAGE}:latest and ${IMAGE}:${GITHUB_SHA}"
