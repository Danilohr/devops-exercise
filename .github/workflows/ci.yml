# CI: build/test + zip package of HelloWorld (Step 1)

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build

  package:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish HelloWorld
        run: |
          dotnet publish HelloWorld/HelloWorld.csproj \
            --configuration Release \
            --output ./publish/HelloWorld

      - name: Upload HelloWorld package
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld
          path: src/publish/HelloWorld
          if-no-files-found: error

